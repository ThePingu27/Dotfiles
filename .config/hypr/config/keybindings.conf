#################
### Variables ###
#################

$scripts = $HOME/.config/hypr/scripts

###################
### Keybindings ###
###################

# Keyword for super key
$mainMod = Super

# Keybinds for commonly used programs
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, O, exec, $DocViewer
bind = $mainMod, S, exec, $textEditor
bind = $mainMod SHIFT, D, exec, discord
bind = $mainMod, D, exec, $terminal discordo
bind = $mainMod SHIFT, S, exec, $scripts/Screenshot.sh
bind = $mainMod, T, exec, $terminal nvim # Open nvim in kitty terminal
bind = CTRL ALT, P, exec, $scripts/Wlogout.sh
bind = CTRL ALT, B, exec, pkill -SIGUSR1 waybar # Toggle hide/show waybar
bind = $mainMod ALT, R , exec, $scripts/Refresh.sh # Refresh waybar/rofi/swaync
bind = $mainMod, N, exec, $scripts/Hyprsunset.sh toggle

# Keybindings for traversal
bind = $mainMod, Q, killactive, # closes (not kills) active window
bind = $mainMod SHIFT, Q, exec, $scripts/KillActiveProcess.sh # kills active window
bind = $mainMod, Space, exec, pkill rofi || true && rofi -show drun # restart and show apps via rofi
bind = $mainMod ALT, Space, exec, pkill rofi || true && rofi -show window # restart and windows via rofi
bind = $mainMod, tab, workspace, m+1
bind = $mainMod SHIFT, tab, workspace, m-1

# Keybinds for windows
bind = $mainMod SHIFT, F, fullscreen # actual fullscreen
bind = $mainMod CTRL, F, fullscreen, 1 # fake fullscreen
bind = $mainMod, L, exec, hyprlock # lock screen

# Resize Windows
binde = $mainMod SHIFT, left, resizeactive, -50 0
binde = $mainMod SHIFT, right, resizeactive, 50 0
binde = $mainMod SHIFT, up, resizeactive, 0 -50
binde = $mainMod SHIFT, down, resizeactive, 0 50

# Move Windows
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

# Swap Windows
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

# Move focus of windows with a keyboard
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Cycle windows and bring them to thae top
bind = ALT, tab, cyclenext
bind = ALT, tab, bringactivetotop

# Switch to workspace with Super + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to any workspace with Super + Shift + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move active window to a workspace silently mainMod + CTRL [0-9]
bind = $mainMod CTRL, code:10, movetoworkspacesilent, 1 # NOTE: code:10 = key 1
bind = $mainMod CTRL, code:11, movetoworkspacesilent, 2 # NOTE: code:11 = key 2
bind = $mainMod CTRL, code:12, movetoworkspacesilent, 3 # NOTE: code:12 = key 3
bind = $mainMod CTRL, code:13, movetoworkspacesilent, 4 # NOTE: code:13 = key 4
bind = $mainMod CTRL, code:14, movetoworkspacesilent, 5 # NOTE: code:14 = key 5
bind = $mainMod CTRL, code:15, movetoworkspacesilent, 6 # NOTE: code:15 = key 6
bind = $mainMod CTRL, code:16, movetoworkspacesilent, 7 # NOTE: code:16 = key 7
bind = $mainMod CTRL, code:17, movetoworkspacesilent, 8 # NOTE: code:17 = key 8
bind = $mainMod CTRL, code:18, movetoworkspacesilent, 9 # NOTE: code:18 = key 9
bind = $mainMod CTRL, code:19, movetoworkspacesilent, 10 # NOTE: code:19 = key 0
bind = $mainMod CTRL, bracketleft, movetoworkspacesilent, -1 # brackets [
bind = $mainMod CTRL, bracketright, movetoworkspacesilent, +1 # brackets ]

# Move/resize windows with Super + left/right click while dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# laptop keybinds
binde = , xf86KbdBrightnessDown, exec, $scripts/BrightnessKbd.sh --dec
binde = , xf86KbdBrightnessUp, exec, $scripts/BrightnessKbd.sh --inc
binde = , xf86MonBrightnessDown, exec, $scripts/Brightness.sh --dec
binde = , xf86MonBrightnessUp, exec, $scripts/Brightness.sh --inc
bind = , xf86TouchPadToggle, exec, $scripts/Touchpad.sh

# Media controls for the laptop
bindl = , xf86AudioPlayPause, exec, $scripts/MediaCntrl.sh --pause # pause/unpause
bindl = , xf86AudioPause, exec, $scripts/MediaCntrl.sh --pause # pause/unpause
bindl = , xf86AudioPlay, exec, $scripts/MediaCntrl.sh --pause # pause/unpause
bindl = , xf86AudioNext, exec, $scripts/MediaCntrl.sh --nxt # Next
bindl = , xf86AudioPrev, exec, $scripts/MediaCntrl.sh --prv # Previous
bindl = , xf86audiostop, exec, $scripts/MediaCntrl.sh --stop #stop

$TOUCHPAD_ENABLED = true
device {
	name = $Touchpad_Device
	enabled = $TOUCHPAD_ENABLED
}
