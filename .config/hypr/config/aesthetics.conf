#####################
### Look and Feel ###
#####################

# general variables

general {
	gaps_in = 5
	gaps_out = 10

	border_size = 2
	
	col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
	col.inactive_border = rgba(595959aa)

	resize_on_border = true

	allow_tearing = false

	layout = dwindle
}

# decoration variables
decoration {
	rounding = 10
	rounding_power = 2

	active_opacity = 1.0
	inactive_opacity = 0.9
	fullscreen_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.1

	# shadow deorations
	shadow {
		enabled = true
		range = 3
		render_power = 1
		color = rgba(1a1a1aee)
	}
	
	# blur decorations
	blur{
		enabled = true
		size = 6
		passes = 2
		vibrancy = 0.1696

		new_optimizations = true
		xray = true

		special = true
		popups = true
	}
}

#animation varibles

animations {
	enabled = true
	
	#Default Curves:
	#	 Name, X_0, Y_0, X_1, Y_1
	bezier = easeOutQuint, 0.23, 1, 0.32, 1 
	bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
	bezier = linear, 0, 0, 1, 1
	bezier = almostLinear, 0.5, 0.5, 0.75, 1
	bezier = quick, 0.15, 0, 0.1, 1

	#Default Animations:
		#  Name, On/Off, Speed, Curve, Style 
	animation = global, 1, 10, default
	animation = border, 1, 5.39, easeOutQuint
#	animation = windows 1, 4.79, easeOutQunit
	animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
#	animation = windowsOut 1, 1.49, linear, popin 87%
	animation = fadeIn, 1, 1.73, almostLinear
	animation = fadeOut, 1, 1.46, almostLinear
	animation = fade, 1, 3.03, quick
	animation = layers, 1, 3.83, easeOutQuint, fade
	animation = layersIn, 1, 5, easeOutQuint, fade
	animation = layersOut, 1, 1.5, linear, fade
	animation = fadeLayersIn, 1, 1.79, almostLinear
	animation = fadeLayersOut, 1, 1.39, almostLinear
	animation = workspaces, 1, 1.94, almostLinear
	animation = workspacesIn, 1, 1.21, almostLinear, fade
	animation = workspacesOut, 1, 1.94, almostLinear, fade
	animation = zoomFactor, 1, 7, almostLinear#, fade
}

# dwindle layout
dwindle {
	pseudotile = true
	preserve_split = true
	special_scale_factor = 0.8
}

# master layout
master {
	new_status = master
	new_on_top = 1
	mfact = 0.5
}

# misc.
misc {
	force_default_wallpaper = -1 # 0 or 1 to disable anime mascot wallpapers
	disable_hyprland_logo = false # enables random hyprland / anime girl background
	focus_on_activate = false
}
