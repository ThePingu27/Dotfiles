##########################################
# Central Configuration Config (modular) #
##########################################

source = $HOME/.config/hypr/config/monitor.conf
source = $HOME/.config/hypr/config/variables.conf
source = $HOME/.config/hypr/config/autostart.conf
source = $HOME/.config/hypr/config/environment.conf
source = $HOME/.config/hypr/config/aesthetics.conf
source = $HOME/.config/hypr/config/input.conf
source = $HOME/.config/hypr/config/keybindings.conf
source = $HOME/.config/hypr/config/window_rules.conf


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

#############
### Debug ###
#############

debug {
	disable_logs = false
	#overlay = true
}

#################
### Ecosystem ###
#################

ecosystem {
	no_update_news = true
	no_donation_nag = true
	#enforce_permissions = false #false default value
}
