############################
### fuzzel configuration ###
############################

include=~/.config/fuzzel/themes/catppuccin-macchiato/mauve.ini

prompt=">> "
icons-enabled=yes
fields=filename,name,generic
#fields=name,generic,filename,categories,keywords,comment
delayed-filter-ms=400
delayed-filter-limit=20000
show-actions=yes
terminal=kitty -e
anchor=center
lines=10
horizontal-pad=20
image-size-ratio=0.5
match-mode=fzf

# font=monospace
# dpi-aware=auto
# use-bold=no
# placeholder=
