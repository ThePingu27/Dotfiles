# width=30
# tabs=8
# vertical-pad=8
# inner-pad=0

# scaling-filter=box
# image-size-ratio=0.5

# gamma-correct-blending=no
# line-height=<use font metrics>
# letter-spacing=0

# cache=<not set>

[border]
width=2
radius=17
selection-radius=25

[dmenu]
mode=text  # text|index
exit-immediately-if-empty=yes
